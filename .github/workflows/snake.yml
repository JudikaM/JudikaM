name: Generate Profile Cards

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-card.svg?color_snake=%23bb86fc&color_dots=%23161b22,%233b2a63,%235b3fa0,%238b5cf6,%23bb86fc

      - name: Frame the snake in the profile card design
        run: |
          python3 - <<'EOF'
          import re
          path = "dist/snake-card.svg"
          snake = open(path, encoding="utf-8").read()
          w, h = map(int, re.search(r'<svg[^>]*? width="(\d+)" height="(\d+)"', snake).groups())
          pad, top = 20, 46
          W, H = w + 2 * pad, h + top + 10
          font = "'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif"
          inner = snake.replace("<svg ", '<svg x="%d" y="%d" ' % (pad, top), 1)
          card = (
              '<svg xmlns="http://www.w3.org/2000/svg" width="%d" height="%d" viewBox="0 0 %d %d" fill="none">'
              '<rect x="0.5" y="0.5" width="%d" height="%d" rx="10" fill="#0D1117" stroke="#BB86FC" stroke-opacity="0.25"/>'
              '<text x="28" y="38" font-family="%s" font-size="18" font-weight="600" fill="#BB86FC">Contribution Snake</text>'
              '<text x="%d" y="37" text-anchor="end" font-family="%s" font-size="12" fill="#8B949E">last 12 months of contributions</text>'
              "%s</svg>"
          ) % (W, H, W, H, W - 1, H - 1, font, W - 28, font, inner)
          open(path, "w", encoding="utf-8").write(card)
          EOF

      # The public streak-stats server tells GitHub to cache its card for 24 hours,
      # so the README serves this hourly copy from the output branch instead.
      - name: Fetch the streak card
        run: |
          url='https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&timezone=Asia/Jakarta&card_width=830&border_radius=10&border=BB86FC40&background=0,0D1117,1A1025,0D1117&stroke=BB86FC66&ring=BB86FC&fire=D2A8FF&currStreakLabel=BB86FC&currStreakNum=F0F6FC&sideNums=BB86FC&sideLabels=C9D1D9&dates=8B949E&date_format=M%20j%5B%2C%20Y%5D'
          for attempt in 1 2 3; do
            # Error cards also come back as 200 SVGs, so check for the real labels.
            if curl -sfL --max-time 30 "$url" -o streak.svg \
              && grep -q 'Current Streak' streak.svg && grep -q 'Total Contributions' streak.svg; then
              mv streak.svg dist/streak.svg
              exit 0
            fi
            sleep 15
          done
          echo "::warning::streak-stats is unavailable, keeping the previous card"
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/output/streak.svg" -o dist/streak.svg

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
