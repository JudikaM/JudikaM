name: Generate Profile Cards

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23bb86fc&color_dots=%231c1a2b,%233b2a63,%235b3fa0,%238b5cf6,%23bb86fc

      # The public github-readme-stats server is paused, so the cards are drawn here
      # from the GraphQL API and served from the output branch.
      - name: Draw the stats, languages and snake cards
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import datetime, json, os, urllib.request
          from xml.sax.saxutils import escape

          user = os.environ["GH_USER"]
          query = """query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                totalCommitContributions totalPullRequestContributions totalIssueContributions
                contributionCalendar { totalContributions weeks { firstDay contributionDays { date contributionCount } } }
              }
              pullRequests { totalCount }
              merged: pullRequests(states: MERGED) { totalCount }
              repositories(ownerAffiliations: OWNER, privacy: PUBLIC, isFork: false, first: 100) {
                totalCount
                nodes { stargazerCount languages(first: 20) { edges { size node { name color } } } }
              }
            }
          }"""
          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps({"query": query, "variables": {"login": user}}).encode(),
              headers={"Authorization": "bearer " + os.environ["GITHUB_TOKEN"], "Content-Type": "application/json"},
          )
          data = json.load(urllib.request.urlopen(req, timeout=30))["data"]["user"]
          repos = data["repositories"]["nodes"]

          font = "'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif"
          # Both cards are terminal windows on the banner's judika@m host: traffic lights,
          # a title, and the prompt running the command whose output the card shows.
          H = 230
          mono = "ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace"
          tty = '<text x="%g" y="%g" font-family="' + mono + '" font-size="11.5"%s>%s</text>'
          prompt = '[<tspan fill="#BB86FC">judika@m</tspan> ~]$ '

          def window(w, command, body):
              return (
                  '<svg xmlns="http://www.w3.org/2000/svg" width="%d" height="%d" viewBox="0 0 %d %d" fill="none">'
                  '<rect x="0.5" y="0.5" width="%d" height="%d" rx="10" fill="#0D1117" stroke="#BB86FC" stroke-opacity="0.25"/>'
                  '<path d="M0.5 30.5V10.5a10 10 0 0 1 10-10h%d a10 10 0 0 1 10 10v20Z" fill="#BB86FC" fill-opacity="0.06"/>'
                  '<path d="M1 30.5H%d" stroke="#BB86FC" stroke-opacity="0.18"/>'
                  '<circle cx="20" cy="16" r="5" fill="#ff5f56"/><circle cx="37" cy="16" r="5" fill="#ffbd2e"/>'
                  '<circle cx="54" cy="16" r="5" fill="#27c93f"/>%s%s%s</svg>'
              ) % (w, H, w, H, w - 1, H - 1, w - 21, w - 1,
                   tty % (w / 2, 20, ' text-anchor="middle" fill="#8B949E"', "judika@m: ~"),
                   tty % (22, 54, ' fill="#C9D1D9"', prompt + command), body)

          # Activity: a fastfetch run, with the stats as its info lines and a weekly
          # sparkline drawn as bars.
          col = data["contributionsCollection"]
          calendar = col["contributionCalendar"]
          days = sorted((d["date"], d["contributionCount"]) for wk in calendar["weeks"] for d in wk["contributionDays"])
          month = sum(n for d, n in days if d[:7] == days[-1][0][:7])
          prs, merged = data["pullRequests"]["totalCount"], data["merged"]["totalCount"]
          stars = sum(r["stargazerCount"] for r in repos)
          info = [
              ("Contribs", "%d" % calendar["totalContributions"], "+%d this month" % month if month else ""),
              ("Commits", "%d" % col["totalCommitContributions"], ""),
              ("PRs", "%d" % prs, "%d%% merged" % round(100 * merged / prs) if prs else ""),
              ("Issues", "%d" % col["totalIssueContributions"], ""),
              ("Uptime", "%d active days" % sum(1 for _, n in days if n), ""),
              ("Packages", "%d repos" % data["repositories"]["totalCount"], "&#9733; %d" % stars),
          ]
          body = ""
          # The logo: a J lit up on a 7x7 patch of contribution cells, popping in row by row.
          logo = ["..#####", "....##.", "....##.", "....##.", "##..##.", "##..##.", ".####.."]
          shades = ["#E9D5FF", "#DDBEFE", "#D2A8FF", "#C697FD", "#BB86FC", "#A774F8", "#8B5CF6"]
          # The glow is a soft halo behind each lit cell: Chrome hides cells that pop in under a filter.
          body += ("<style>@keyframes pop{from{opacity:0;transform:scale(.3)}}"
                   ".j{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}</style>")
          for r, (row, shade) in enumerate(zip(logo, shades)):
              for c, cell in enumerate(row):
                  x, y = 26 + 14 * c, 86 + 14 * r
                  if cell == "#":
                      delay = 0.2 + 0.07 * (r + c)
                      body += ('<rect class="j" x="%d" y="%d" width="16" height="16" rx="5" fill="#BB86FC" fill-opacity="0.16" style="animation-delay:%.2fs"/>'
                               '<rect class="j" x="%d" y="%d" width="12" height="12" rx="3" fill="%s" style="animation-delay:%.2fs"/>'
                               % (x - 2, y - 2, delay, x, y, shade, delay))
                  else:
                      body += '<rect x="%d" y="%d" width="12" height="12" rx="3" fill="#1C1A2B"/>' % (x, y)
          X, V = 150, 222
          body += tty % (X, 78, ' font-weight="700" fill="#BB86FC"', 'judika<tspan fill="#C9D1D9">@</tspan>github')
          body += '<path d="M%d 84.5H%d" stroke="#8B949E" stroke-opacity="0.5" stroke-dasharray="4 2"/>' % (X, X + 98)
          for i, (key, value, note) in enumerate(info):
              yy = 101 + 15 * i
              body += tty % (X, yy, ' font-weight="700" fill="#BB86FC"', key)
              body += tty % (V, yy, ' fill="#F0F6FC"', value + ('<tspan fill="#8B949E"> &#183; %s</tspan>' % note if note else ""))
          # Weekly contributions since the first active month, one bar per week.
          first = next((d for d, n in days if n), days[0][0])[:7] + "-01"
          weekly = [sum(d["contributionCount"] for d in wk["contributionDays"])
                    for wk in calendar["weeks"] if wk["contributionDays"][-1]["date"] >= first]
          yy = 101 + 15 * len(info)
          body += tty % (X, yy, ' font-weight="700" fill="#BB86FC"', "Activity")
          peak = max(weekly) or 1
          step = min(9, (470 - V) / max(len(weekly), 1))
          for i, n in enumerate(weekly):
              h = max(12 * n / peak, 2 if n else 1)
              body += '<rect x="%.1f" y="%.1f" width="%.1f" height="%.1f" rx="1" fill="#BB86FC"%s/>' % (
                  V + step * i, yy + 1 - h, step - 2, h, "" if n else ' fill-opacity="0.3"')
          for i, c in enumerate(["#1C1A2B", "#3B2A63", "#5B3FA0", "#8B5CF6", "#BB86FC", "#D2A8FF", "#E9D5FF", "#F0F6FC"]):
              body += '<rect x="%d" y="%d" width="22" height="11" fill="%s"/>' % (X + 22 * i, yy + 11, c)
          open("dist/stats.svg", "w", encoding="utf-8").write(window(495, "fastfetch", body))

          # Languages: github-linguist's output, share and name, with a block bar scaled
          # to the largest. Blade templates and build files would crowd out the real languages.
          skip = {"Blade", "Dockerfile", "Shell", "Makefile", "Procfile"}
          sizes, colors = {}, {}
          for r in repos:
              for e in r["languages"]["edges"]:
                  name = e["node"]["name"]
                  if name not in skip:
                      sizes[name] = sizes.get(name, 0) + e["size"]
                      colors[name] = e["node"]["color"] or "#8B949E"
          total = sum(sizes.values())
          top = sorted(sizes.items(), key=lambda kv: -kv[1])[:6]
          body = ""
          for i, (name, size) in enumerate(top):
              y, share = 82 + 21 * i, size / total
              body += tty % (66, y, ' text-anchor="end" fill="#F0F6FC"', "%.1f%%" % (100 * share))
              body += tty % (78, y, ' fill="#C9D1D9"', escape(name))
              for c in range(max(1, round(20 * size / top[0][1]))):
                  body += '<rect x="%d" y="%d" width="5" height="10" fill="%s"/>' % (172 + 7 * c, y - 9, colors[name])
          # A fresh prompt with the banner's blinking cursor.
          body += tty % (22, 82 + 21 * len(top) + 8, ' fill="#C9D1D9"', prompt + '<tspan class="cur" fill="#BB86FC">&#9608;</tspan>')
          body += "<style>@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}.cur{animation:blink 1.1s infinite}</style>"
          open("dist/languages.svg", "w", encoding="utf-8").write(window(334, "github-linguist", body))

          # Snake: frame the snk grid with GitHub-style month and weekday labels, a live
          # total and a legend. Grid cell (col, row) sits at (16 col + 2, 16 row + 2) in snk's
          # coordinates, and its viewBox starts at (-16, -32).
          import re
          snake = open("dist/snake.svg", encoding="utf-8").read()
          os.remove("dist/snake.svg")
          weeks = [datetime.date.fromisoformat(w["firstDay"]) for w in calendar["weeks"]]
          X0, Y0 = 60, 84
          W, SH = X0 + 16 * len(weeks) + 24, Y0 + 112 + 46
          snake = re.sub(r'<rect class="u[^>]*/>', "", snake)  # the progress bar under the grid
          # Drop the bar's strip from the bottom of snk's viewBox and place the grid in the card.
          root = re.match(r"<svg[^>]*>", snake).group(0)
          vw = int(re.search(r'viewBox="-16 -32 (\d+) \d+"', root).group(1))
          snake = snake.replace(root, '<svg x="%d" y="%d" viewBox="-16 -32 %d 168" width="%d" height="168">'
                                % (X0 - 16, Y0 - 32, vw, vw), 1)
          # Fade the snake from head to tail and give it the banner's glow.
          snake = snake.replace("</svg>", "<style>.s{filter:drop-shadow(0 0 3px #BB86FC99)}"
                                ".s0{fill:#E9D5FF}.s1{fill:#BB86FC}.s2{fill:#9D6CF0}.s3{fill:#7C4DDB}</style></svg>", 1)
          dots = ["#1C1A2B", "#3B2A63", "#5B3FA0", "#8B5CF6", "#BB86FC"]
          label = '<text x="%d" y="%d" font-family="%s" font-size="11" fill="#8B949E"%s>%s</text>'
          body = ""
          for i, day in enumerate(weeks):
              # Label each month where it starts, skipping a first month too narrow to fit.
              if (i == 0 and weeks[min(2, len(weeks) - 1)].month == day.month) or (i and weeks[i - 1].month != day.month):
                  body += label % (X0 + 2 + 16 * i, Y0 - 10, font, "", day.strftime("%b"))
          for row, name in ((1, "Mon"), (3, "Wed"), (5, "Fri")):
              body += label % (X0 - 10, Y0 + 12 + 16 * row, font, ' text-anchor="end"', name)
          foot = Y0 + 112 + 26
          body += label % (X0 + 2, foot, font, "", "%d contributions in the last year" % calendar["totalContributions"])
          x = W - 26 - 28 - 5 * 14
          body += label % (x - 6, foot, font, ' text-anchor="end"', "Less")
          for i, c in enumerate(dots):
              body += '<rect x="%d" y="%d" width="10" height="10" rx="2" fill="%s"/>' % (x + 14 * i, foot - 9, c)
          body += label % (x + 5 * 14 + 2, foot, font, "", "More")
          open("dist/snake-card.svg", "w", encoding="utf-8").write(
              '<svg xmlns="http://www.w3.org/2000/svg" width="%d" height="%d" viewBox="0 0 %d %d" fill="none">'
              '<rect x="0.5" y="0.5" width="%d" height="%d" rx="10" fill="#0D1117" stroke="#BB86FC" stroke-opacity="0.25"/>'
              '<text x="28" y="38" font-family="%s" font-size="18" font-weight="600" fill="#BB86FC">Contribution Snake</text>%s%s</svg>'
              % (W, SH, W, SH, W - 1, SH - 1, font, body, snake))
          print(info, weekly, [(n, round(100 * s / total, 1)) for n, s in top])
          EOF

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
