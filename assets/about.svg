<svg xmlns="http://www.w3.org/2000/svg" width="830" height="336" viewBox="0 0 830 336" fill="none" role="img" aria-labelledby="t d">
<title id="t">About Me</title>
<desc id="d">I'm a 7th-semester Informatics Engineering student at Perbanas Institute Jakarta focused on building secure web applications. That goal is what drew me to cyber security: I study how systems break so I can build ones that don't. I treat security as the foundation of an application, not a feature added at the end. focus: Secure coding (web application security). exploring: Web pentesting (Burp Suite &amp; OWASP Top 10). open_to: Internships (freelance &amp; full-time work). contact: judika.mrp@gmail.com (email me anytime).</desc>
