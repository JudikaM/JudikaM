<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,monospace">
  <title>Judika Marpaung — Cyber Security &amp; Web3</title>
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8ddff"/>
      <stop offset="0.45" stop-color="#bb86fc"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#bb86fc" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#bb86fc" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#bb86fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#bb86fc" stroke-opacity="0.05" fill="none"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="winShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="type1"><rect class="t1" x="112" y="94" width="0" height="28"/></clipPath>
    <clipPath id="type2"><rect class="t2" x="112" y="226" width="0" height="28"/></clipPath>
  </defs>

  <style>
    .term    { opacity:0; transform:translateY(12px); animation:rise .6s cubic-bezier(.2,.7,.3,1) .1s forwards; }
    @keyframes rise { to { opacity:1; transform:translateY(0); } }

    .t1 { animation:w1 .7s  steps(6,end)  .9s forwards; }
    .t2 { animation:w2 1.5s steps(37,end) 3.2s forwards; }
    @keyframes w1 { to { width:80px; } }
    @keyframes w2 { to { width:392px; } }

    .fade { opacity:0; animation:fadeUp .55s ease-out forwards; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .d1 { animation-delay:1.9s; }
    .d2 { animation-delay:2.4s; }

    .chk { opacity:0; animation:pop .35s ease-out forwards; }
    @keyframes pop { from { opacity:0; transform:scale(.92); } to { opacity:1; transform:scale(1); } }
    .c1 { animation-delay:5.0s; }
    .c2 { animation-delay:5.35s; }
    .c3 { animation-delay:5.7s; }

    .verdict    { opacity:0; animation:fadeUp .5s ease-out 6.2s forwards; }
    .cursorline { opacity:0; animation:show .01s linear 6.8s forwards; }
    @keyframes show { to { opacity:1; } }
    .caret { animation:blink 1.1s step-end 6.8s infinite; }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }

    .hex  { animation:float 9s ease-in-out infinite alternate; }
    .hex2 { animation-duration:12s; animation-delay:-4s; }
    @keyframes float { from { transform:translateY(-8px); } to { transform:translateY(10px); } }
  </style>

  <!-- background -->
  <rect width="1200" height="360" fill="#0d1117"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#bgGlow)"/>

  <!-- decorative blockchain motifs -->
  <g class="hex" stroke="#bb86fc" stroke-opacity="0.20" fill="none" stroke-width="1.5">
    <polygon points="1174,44 1162,64.8 1138,64.8 1126,44 1138,23.2 1162,23.2"/>
    <circle cx="1180" cy="96" r="3" fill="#bb86fc" fill-opacity="0.25" stroke="none"/>
  </g>
  <g class="hex hex2" stroke="#bb86fc" stroke-opacity="0.16" fill="none" stroke-width="1.5">
    <path d="M36 236 L54 266 L36 278 L18 266 Z M36 284 L54 272 L36 306 L18 272 Z"/>
    <circle cx="52" cy="180" r="3" fill="#bb86fc" fill-opacity="0.25" stroke="none"/>
  </g>

  <!-- terminal window -->
  <g class="term">
    <rect x="70" y="34" width="1060" height="292" rx="14" fill="#151a21" fill-opacity="0.94" stroke="#30363d" filter="url(#winShadow)"/>
    <rect x="70" y="34" width="1060" height="292" rx="14" fill="none" stroke="url(#nameGrad)" stroke-opacity="0.30"/>

    <!-- title bar -->
    <path d="M70 48 a14 14 0 0 1 14 -14 h1032 a14 14 0 0 1 14 14 v22 H70 Z" fill="#1c2129"/>
    <circle cx="98"  cy="52" r="6.5" fill="#ff5f57"/>
    <circle cx="120" cy="52" r="6.5" fill="#febc2e"/>
    <circle cx="142" cy="52" r="6.5" fill="#28c840"/>
    <text x="600" y="57" text-anchor="middle" font-size="13" fill="#8b949e">judika@kali: ~/web3-security</text>

    <!-- $ whoami -->
    <text x="100" y="114" font-size="17" fill="#3fb950">$</text>
    <g clip-path="url(#type1)">
      <text x="118" y="114" font-size="17" fill="#c9d1d9">whoami</text>
    </g>

    <!-- name + role -->
    <g class="fade d1">
      <text x="100" y="168" font-size="40" font-weight="700" fill="#bb86fc" opacity="0.55" filter="url(#softGlow)">Judika Marpaung</text>
      <text x="100" y="168" font-size="40" font-weight="700" fill="url(#nameGrad)">Judika Marpaung</text>
    </g>
    <text class="fade d2" x="100" y="200" font-size="16.5" fill="#9aa4b2">Cyber Security Enthusiast · Smart Contract Auditor · Web3 Builder</text>

    <!-- $ ./audit -->
    <text x="100" y="246" font-size="17" fill="#3fb950">$</text>
    <g clip-path="url(#type2)">
      <text x="118" y="246" font-size="17" fill="#c9d1d9">./audit contracts/ --network ethereum</text>
    </g>

    <!-- audit results -->
    <text class="chk c1" x="100" y="284" font-size="16" fill="#3fb950">[✓] reentrancy</text>
    <text class="chk c2" x="252" y="284" font-size="16" fill="#3fb950">[✓] overflow</text>
    <text class="chk c3" x="390" y="284" font-size="16" fill="#3fb950">[✓] access-control</text>
    <text class="verdict" x="592" y="284" font-size="16" font-weight="700" fill="#bb86fc">→ 0 critical findings</text>

    <!-- blinking prompt -->
    <g class="cursorline">
      <text x="100" y="314" font-size="17" fill="#3fb950">$</text>
      <rect class="caret" x="120" y="300" width="9" height="18" fill="#bb86fc"/>
    </g>
  </g>
</svg>
