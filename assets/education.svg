<desc id="d">Perbanas Institute Jakarta — B.Sc. Informatics Engineering, 2023 — present. Focused on network security, secure programming, and software development in information technology. PBD Aviation Vocational High School, Medan — Vocational — Electrical Avionic, 2020 — 2023. Specialized in aircraft electrical systems and avionics, building a strong technical foundation.</desc>
